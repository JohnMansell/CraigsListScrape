[project]
name = "craigslist-scrape"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "h2>=4.4.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "nicegui>=3.16.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "selectolax>=0.4.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
